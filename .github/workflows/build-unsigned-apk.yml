name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive
      - name: Remove release signing for an unsigned APK
        run: |
          python3 - <<'PY_GRADLE'
          from pathlib import Path
          import re
          path = Path('android/app/build.gradle')
          text = path.read_text()
          pattern = r'(buildTypes\s*\{[\s\S]*?\brelease\s*\{[\s\S]*?)signingConfig\s+signingConfigs\.debug'
          text, count = re.subn(pattern, r'\1// unsigned APK build: signing config intentionally removed', text, count=1)
          if count != 1:
              raise SystemExit('Could not remove default release signing config from generated Gradle file')
          path.write_text(text)
          PY_GRADLE
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tbomb-mobile-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
