name: Build BMB-Me
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  web-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx expo export --platform web
      - uses: actions/upload-artifact@v4
        with:
          name: bmb-me-web
          path: dist/
