name: Generate Android Signing Keystore
on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Alias to create in the keystore'
        required: true
        default: 'tbomb-release'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate temporary keystore
        env:
          KEY_ALIAS: ${{ inputs.key_alias }}
        run: |
          STORE_PASS="$(openssl rand -base64 30 | tr -d '\n/=+' | cut -c1-28)"
          KEY_PASS="$(openssl rand -base64 30 | tr -d '\n/=+' | cut -c1-28)"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" -storetype PKCS12 -alias "$KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=TBomb Mobile, OU=Android, O=Personal, L=Unknown, ST=Unknown, C=IN" -storepass "$STORE_PASS" -keypass "$KEY_PASS"
          echo "KEYSTORE_BASE64=$(base64 -w0 "$RUNNER_TEMP/release.keystore")" >> "$GITHUB_ENV"
          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
      - name: Show one-time secret setup instructions
        env:
          KEYSTORE_BASE64: ${{ env.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ env.STORE_PASS }}
          KEY_PASS: ${{ env.KEY_PASS }}
          KEY_ALIAS: ${{ inputs.key_alias }}
        run: |
          echo "::add-mask::$KEYSTORE_BASE64"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo 'A keystore was generated on this temporary runner. GitHub masks the values below for safety; do not use this workflow output as a way to retrieve secret values. Prefer generating the keystore locally and adding its values directly to repository Actions Secrets.'
          echo 'Generated a temporary keystore and masked its sensitive values. This workflow does not export the key. For signed releases, generate and back up a keystore in a secure environment, then add the four required GitHub Actions secrets.'
